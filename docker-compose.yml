version: '3.8'

services:
  # Motor 1: Qdrant (Eficiencia basada en Rust)
  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: tfm-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 5120M # Límite estricto de 5 GB de RAM

  # Motor 2: Milvus Standalone (Arquitectura distribuida)
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: tfm-milvus-etcd
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: tfm-milvus-minio
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.3.10
    container_name: tfm-milvus-standalone
    ports:
      - "19530:19530"
    volumes:
      - milvus_data:/var/lib/milvus
    command: ["milvus", "run", "standalone"]
    depends_on:
      - "etcd"
      - "minio"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    deploy:
      resources:
        limits:
          memory: 6144M # Límite estricto de 6 GB de RAM

volumes:
  qdrant_data:
  etcd_data:
  minio_data:
  milvus_data: